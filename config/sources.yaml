source_policy:
  primary_required_per_layer: true
  fetched_pages_only: true
  search_snippets_are_sources: false
  independent_trigger_corroboration_preferred: true
  syndicated_reprints_are_independent: false
  access_rule: >
    Respect robots rules, paywalls, and access controls. If a page cannot be read, record the gap
    and drop the layer or candidate instead of inferring its contents.

