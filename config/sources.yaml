discovery:
  enabled: true
  rule: >
    Credible sources outside this list are allowed. Record who controls the source, whether it is
    independent, why it is credible, and the exact claim it supports.
  geography: >
    Search statewide. Distinguish ERCOT, SPP, WECC, and MISO territory. Include North Texas,
    Central Texas, Houston and the Gulf Coast, San Antonio, West Texas, the Panhandle, East Texas,
    the Rio Grande Valley, and rural regions when the mechanism actually reaches them.

